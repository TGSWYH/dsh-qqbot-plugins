name: check-pack

# PR 检查：把明显有问题的扩展包挡在合并之前。
#
# 逻辑全在 scripts/check-packs.mjs 里（node），不写 shell 逻辑 ——
# Actions 的 run 默认是 `bash -e`，`[ -z "$x" ] && continue` 这类写法
# 在条件为假时返回 1，会把整个 step 直接判失败（2026-10-24 踩过这个坑）。
on:
  pull_request:
    paths:
      - 'packs/**'
      - 'scripts/**'
      - '.github/workflows/check-pack.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 找出本次改动的插件目录
        id: packs
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          dirs=$(git diff --name-only "$base" "$head" -- 'packs/' | cut -d/ -f1-2 | sort -u | tr '\n' ' ')
          echo "改动目录: ${dirs:-（无）}"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      - name: 校验扩展包
        run: node scripts/check-packs.mjs ${{ steps.packs.outputs.dirs }}

      - name: 预演生成索引（不提交）
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.head_ref }}
        run: |
          node scripts/build-index.mjs
          node -e "const j=require('./index.json'); console.log('✓ 索引可生成，插件数: '+j.plugins.length)"
