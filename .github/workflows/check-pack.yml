name: check-pack

# PR 检查：把明显有问题的扩展包挡在合并之前。
#
# 两个教训（2026-10-24 都踩了）：
#   ① 不要用 shell 逻辑做校验。Actions 的 run 默认 `bash -e`，
#      `[ -z "$x" ] && continue` 条件为假时返回 1，会直接把 step 判失败。
#   ② 不要把 step 输出拼进命令参数。值里带空格/换行时，GitHub 表达式
#      展开后引号可能不配对，bash 直接 `unexpected EOF`（exit 2），
#      校验脚本根本没跑。所以这里不传参数，脚本自己全量扫 packs/。
on:
  pull_request:
    paths:
      - 'packs/**'
      - 'scripts/**'
      - '.github/workflows/check-pack.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验扩展包
        run: node scripts/check-packs.mjs

      - name: 预演生成索引（不提交）
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.head_ref }}
        run: |
          node scripts/build-index.mjs
          node -e "const j=require('./index.json'); console.log('✓ 索引可生成，插件数: '+j.plugins.length)"
